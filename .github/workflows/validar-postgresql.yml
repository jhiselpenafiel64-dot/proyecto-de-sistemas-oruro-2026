name: Validar migracion PostgreSQL

on:
  push:
    branches:
      - migracion-postgresql
  pull_request:
    branches:
      - main
    paths:
      - '**.php'
      - 'Dockerfile'
      - 'render.yaml'
      - '.github/workflows/validar-postgresql.yml'

permissions:
  contents: read

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_pgsql
          coverage: none

      - name: Comprobar sintaxis PHP
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            echo "Revisando: $file"
            php -l "$file"
          done < <(find . -type f -name '*.php' -not -path './.git/*' -print0)

      - name: Construir imagen Docker
        run: docker build -t la-polar-postgresql:test .
