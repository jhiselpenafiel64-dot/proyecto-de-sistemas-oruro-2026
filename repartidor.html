<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dulce Vita | Pedidos asignados de delivery</title>
    <link rel="icon" type="image/png" href="logo.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css" rel="stylesheet">
    <style>body{background:#F8EEDC}.marca{color:#6B2635}.pedido-delivery{border:0;border-radius:1rem}</style>
</head>
<body>
<main class="container py-4">
    <header class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-4">
        <div class="d-flex align-items-center gap-3"><img id="logoRepartidor" src="logo.png" alt="Logo Dulce Vita" width="56" height="56" class="rounded"><div><h1 class="h3 marca mb-0">Mis pedidos asignados</h1><span id="nombreRepartidor" class="text-secondary"></span></div></div>
        <button class="btn btn-outline-danger" id="cerrarSesionRepartidor" type="button"><i class="bi bi-box-arrow-right me-1"></i>Cerrar sesión</button>
    </header>
    <div id="mensajeDelivery" class="alert d-none" role="status" aria-live="polite"></div>
    <div id="listaPedidosDelivery" class="d-grid gap-3"><p>Cargando pedidos pendientes...</p></div>
</main>
<script src="auth.js?v=delivery-3"></script>
<script src="repartidor.js?v=asignacion-delivery-1"></script>
<script src="identidad.js?v=1"></script>
</body>
</html>
